name: CI

# Third-party actions are pinned to immutable commit SHAs (not mutable
# `@v4`-style tags). Pins last refreshed: 2026-04-17.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Intentionally no global `RUSTFLAGS: -D warnings`. The crate's
  # `[lints.rust]` table already declares `unsafe_code = "forbid"` and
  # the usual deny-list, and `#![deny(warnings)]` at the lib root
  # promotes ordinary rustc warnings to errors. `clippy::pedantic` is
  # declared at `warn` level in Cargo.toml so pedantic findings don't
  # break the `cargo check` / `cargo test` jobs; the dedicated clippy
  # job below still runs with `-D warnings` on its CLI.

jobs:
  check:
    name: cargo check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.3-ish — commit 0c366fd6a8 on main, 2026-04-17
        uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - name: Install Rust toolchain (from rust-toolchain.toml)
        # dtolnay/rust-toolchain — commit 3c5f7ea28c on master, 2026-04-17
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.93"
          components: clippy, rustfmt
      - name: Cache cargo registry + target
        # actions/cache — commit 27d5ce7f10 on main, 2026-04-17
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-
      - run: cargo check --all-features --locked

  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.93"
          components: clippy, rustfmt
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
      - run: cargo test --all-features --locked

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.93"
          components: clippy, rustfmt
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-
      # -D warnings promotes every Clippy warning (including the crate's
      # `pedantic = "warn"` group) to an error. Any new pedantic finding
      # will therefore fail CI — keeping the strict posture the handoff
      # specified. If a finding turns out to be a false-positive for
      # this codebase, file a targeted `#[allow(clippy::...)]` with a
      # comment explaining why, rather than removing `-D warnings`.
      - run: cargo clippy --all-features --locked --all-targets -- -D warnings

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - name: Run cargo-deny
        # EmbarkStudios/cargo-deny-action — commit f28dad79a1 on main, 2026-04-17
        uses: EmbarkStudios/cargo-deny-action@f28dad79a1c0736fb9bef3766fec993bb67416c5
        with:
          command: check

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@0c366fd6a839edf440554fa01a7085ccba70ac98
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: "1.93"
      - name: Install cargo-audit
        # taiki-e/install-action — commit e15ecae65f on main, 2026-04-17
        uses: taiki-e/install-action@e15ecae65fac57938979d795ac11e57c22b9b633
        with:
          tool: cargo-audit
      - run: cargo audit
