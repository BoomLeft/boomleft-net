[package]
name = "boomleft-net"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "BoomLeft family shared network-layer: feed parsing, OPML, geo utils. Sibling to PrivacySuite-Core-SDK."
authors = ["BoomLeft LLC"]
license = "Proprietary"
repository = "https://github.com/BoomLeft/boomleft-net"
publish = false

[dependencies]
feed-rs = "=2.4.0"
url = "=2.5.8"
anyhow = "=1.0.104"
serde = { version = "=1.0.229", features = ["derive"] }
tracing = "=0.1.44"

# Transitive pin: constant_time_eq 0.4.3 requires rustc 1.95, but our
# toolchain pins 1.93. Remove once SDK MSRV >= 1.95.
constant_time_eq = "=0.4.2"

# Provides the canonical TRACKING_PARAMS blocklist used by the URL sanitizer.
privacysuite-core-sdk = { git = "https://github.com/BoomLeft/PrivacySuite-Core-SDK", tag = "v0.4.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "deny"
unreachable_pub = "deny"
unused_results = "deny"
elided_lifetimes_in_paths = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
mem_forget = "deny"
large_stack_arrays = "warn"
indexing_slicing = "warn"
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"
panic = "abort"
overflow-checks = true

[profile.dev]
overflow-checks = true
debug = true
